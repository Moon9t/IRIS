# Nightly — extended testing and pre-release builds.
# Runs on a schedule (every night at 02:00 UTC) and can be triggered manually.
# Extended fuzz campaigns, full native compilation smoke tests, and
# performance regression detection.

name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'     # 02:00 UTC daily
  workflow_dispatch:          # manual trigger

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ───────────────────── extended fuzz campaign ─────────────────────
  fuzz:
    name: Extended Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_lexer, fuzz_parser, fuzz_lowerer, fuzz_compiler]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
            fuzz/corpus
          key: ${{ runner.os }}-fuzz-nightly-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Diagnostic Info
        run: |
          cargo --version
          rustc --version
          cargo fuzz --version
      - name: Fuzz ${{ matrix.target }} (30 min)
        id: fuzz
        continue-on-error: true
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- \
            -max_total_time=1800 -max_len=8192
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload fuzz corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/corpus/${{ matrix.target }}/
          retention-days: 30

  # ───────────────── native compilation smoke test ──────────────────
  smoke-test:
    name: Smoke Test (native compilation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release

      - name: Run all examples with iris run
        run: |
          PASS=0
          FAIL=0
          SKIP=0
          while IFS= read -r f; do
            NAME=$(basename "$f")
            echo "=== Testing: $NAME ==="
            # Set a 30-second timeout per example
            if timeout 30 ./target/release/iris run "$f" > /dev/null 2>&1; then
              echo "  PASS"
              PASS=$((PASS + 1))
            else
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 124 ]; then
                echo "  SKIP (timeout)"
                SKIP=$((SKIP + 1))
              else
                echo "  FAIL (exit $EXIT_CODE)"
                FAIL=$((FAIL + 1))
              fi
            fi
          done < <(find examples -type f -name '*.iris' | sort)
          echo ""
          echo "=== Results ==="
          echo "  Pass: $PASS"
          echo "  Fail: $FAIL"
          echo "  Skip: $SKIP"
          # Don't fail the job — some examples may require external resources
          if [ $FAIL -gt 10 ]; then
            echo "ERROR: Too many failures ($FAIL)"
            exit 1
          fi

  # ───────────────── ML integration tests ──────────────────────────
  ml-tests:
    name: ML Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release

      - name: Test ML examples
        run: |
          while IFS= read -r f; do
            echo "=== ML Test: $(basename $f) ==="
            timeout 60 ./target/release/iris run "$f" || echo "  WARN: exit $?"
          done < <(find examples/06_machine_learning examples/07_applications -type f \( -name 'ml_*.iris' -o -name 'ais_*.iris' \) | sort)

  # ───────────────── binary size tracking ──────────────────────────
  binary-size:
    name: Binary Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Report binary size
        run: |
          SIZE=$(stat -c%s target/release/iris)
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "IRIS binary size: ${SIZE_MB} MB (${SIZE} bytes)"

          # Load previous size from cache
          mkdir -p size-tracking
          if [ -f size-tracking/previous.txt ]; then
            PREV=$(cat size-tracking/previous.txt)
            DIFF=$((SIZE - PREV))
            PCT=$(echo "scale=1; $DIFF * 100 / $PREV" | bc 2>/dev/null || echo "0")
            echo "Previous: $PREV bytes"
            echo "Change: $DIFF bytes (${PCT}%)"
            if [ $DIFF -gt $((PREV / 5)) ]; then
              echo "WARNING: Binary grew by more than 20%!"
            fi
          fi
          echo "$SIZE" > size-tracking/previous.txt

      - uses: actions/cache/save@v4
        with:
          path: size-tracking/
          key: binary-size-${{ runner.os }}-${{ github.sha }}

  # ───────────────── performance benchmarks ────────────────────────
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Run benchmarks
        run: |
          mkdir -p bench-results
          for f in benches/*.iris examples/02_functions/fibonacci.iris examples/02_functions/factorial.iris; do
            if [ -f "$f" ]; then
              NAME=$(basename "$f" .iris)
              echo "=== Benchmark: $NAME ==="
              OUTPUT=$(./target/release/iris bench "$f" -n 50 2>&1 || true)
              echo "$OUTPUT"
              echo ""
            fi
          done

  windows-test-and-installer:
    name: Windows JIT & Installer Verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure LLVM toolchain
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (Test-Path "$llvmBin\clang.exe") {
            echo "LLVM pre-installed at $llvmBin"
            echo "$llvmBin" >> $env:GITHUB_PATH
            echo "IRIS_CLANG=$llvmBin\clang.exe" >> $env:GITHUB_ENV
          } else {
            echo "LLVM not pre-installed. Installing via choco..."
            choco install llvm --no-progress -y
            echo "$llvmBin" >> $env:GITHUB_PATH
            echo "IRIS_CLANG=$llvmBin\clang.exe" >> $env:GITHUB_ENV
          }

      - name: Install MinGW ucrt64 dependencies
        shell: bash
        run: |
          C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed \
            mingw-w64-ucrt-x86_64-headers-git \
            mingw-w64-ucrt-x86_64-crt-git \
            mingw-w64-ucrt-x86_64-gcc-libs \
            mingw-w64-ucrt-x86_64-winpthreads-git 2>&1 || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release compiler
        run: cargo build --release

      - name: Run examples with JIT on Windows
        shell: pwsh
        run: |
          $pass = 0
          $fail = 0
          $files = Get-ChildItem -Path examples -Filter *.iris -Recurse
          foreach ($f in $files) {
              Write-Host "=== Testing: $($f.Name) ==="
              & target\release\iris.exe run $f.FullName > $null 2>&1
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "  PASS"
                  $pass++
              } else {
                  Write-Host "  FAIL (exit $LASTEXITCODE)"
                  $fail++
              }
          }
          Write-Host ""
          Write-Host "=== Results ==="
          Write-Host "  Pass: $pass"
          Write-Host "  Fail: $fail"
          if ($fail -gt 10) {
              Write-Error "Too many JIT failures on Windows!"
              exit 1
          }

      - name: Package VS Code Extension
        shell: pwsh
        run: |
          cd vscode-iris
          npm ci
          npm run compile
          npx @vscode/vsce package --no-dependencies

      - name: Verify Inno Setup installer compilation
        shell: pwsh
        run: |
          & installer\build_installer.ps1 -Version "nightly" -SkipBuild

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-nightly-windows-x64-setup
          path: installer/dist/IRIS-nightly-windows-x64-setup.exe
