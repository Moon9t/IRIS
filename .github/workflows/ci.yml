# CI — runs on every push and pull request
# Builds the compiler, runs all tests, and checks formatting.
# Optimized and simplified for high speed and reliability.

name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_MIN_STACK: 16777216

jobs:
  test:
    name: Test (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: Windows
            runner: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: macOS
            runner: macos-latest
            arch: arm64
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Configure LLVM toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "IRIS_CLANG=/usr/bin/clang" >> "$GITHUB_ENV"

      - name: Configure LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -f "/opt/homebrew/opt/llvm/bin/clang" ]; then
            echo "IRIS_CLANG=/opt/homebrew/opt/llvm/bin/clang" >> "$GITHUB_ENV"
            echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          elif [ -f "/usr/local/opt/llvm/bin/clang" ]; then
            echo "IRIS_CLANG=/usr/local/opt/llvm/bin/clang" >> "$GITHUB_ENV"
            echo "/usr/local/opt/llvm/bin" >> "$GITHUB_PATH"
          else
            echo "IRIS_CLANG=/usr/bin/clang" >> "$GITHUB_ENV"
          fi

      - name: Configure LLVM toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (Test-Path "$llvmBin\clang.exe") {
            echo "LLVM pre-installed at $llvmBin"
            echo "$llvmBin" >> $env:GITHUB_PATH
            echo "IRIS_CLANG=$llvmBin\clang.exe" >> $env:GITHUB_ENV
          } else {
            echo "LLVM not pre-installed. Installing via choco..."
            choco install llvm --no-progress -y
            echo "$llvmBin" >> $env:GITHUB_PATH
            echo "IRIS_CLANG=$llvmBin\clang.exe" >> $env:GITHUB_ENV
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --verbose --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --verbose --target ${{ matrix.target }} -- --test-threads=1

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure LLVM toolchain
        run: |
          echo "IRIS_CLANG=/usr/bin/clang" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings -A clippy::collapsible_match -A clippy::useless_conversion

  extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-iris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run compile
      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-iris/*.vsix

  validate-workflows:
    name: Validate Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure LLVM toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          echo "IRIS_CLANG=/usr/bin/clang" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin
      - name: Run code coverage
        run: cargo tarpaulin --verbose --lib --bins --timeout 120 --out xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
