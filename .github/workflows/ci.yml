# CI — runs on every push and pull request
# Builds the compiler, runs all tests, and checks formatting.
# Optimized and simplified for high speed and reliability.

name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 16777216

jobs:
  test:
    name: Test (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: Windows
            runner: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: macOS
            runner: macos-latest
            arch: arm64
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Configure LLVM toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "IRIS_CLANG=/usr/bin/clang" >> "$GITHUB_ENV"

      - name: Configure LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -f "/opt/homebrew/opt/llvm/bin/clang" ]; then
            echo "IRIS_CLANG=/opt/homebrew/opt/llvm/bin/clang" >> "$GITHUB_ENV"
            echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          elif [ -f "/usr/local/opt/llvm/bin/clang" ]; then
            echo "IRIS_CLANG=/usr/local/opt/llvm/bin/clang" >> "$GITHUB_ENV"
            echo "/usr/local/opt/llvm/bin" >> "$GITHUB_PATH"
          else
            echo "IRIS_CLANG=/usr/bin/clang" >> "$GITHUB_ENV"
          fi

      - name: Configure LLVM toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (Test-Path "$llvmBin\clang.exe") {
            echo "LLVM pre-installed at $llvmBin"
            echo "$llvmBin" >> $env:GITHUB_PATH
            echo "IRIS_CLANG=$llvmBin\clang.exe" >> $env:GITHUB_ENV
          } else {
            echo "LLVM not pre-installed. Installing via choco..."
            choco install llvm --no-progress -y
            echo "$llvmBin" >> $env:GITHUB_PATH
            echo "IRIS_CLANG=$llvmBin\clang.exe" >> $env:GITHUB_ENV
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.runner }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.runner }}-${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --verbose --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --verbose --target ${{ matrix.target }} -- --test-threads=1

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - run: cargo clippy --all-targets

  extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-iris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run compile
      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-iris/*.vsix
