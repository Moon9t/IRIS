[package]
name = "iris"
version = "1.0.0-rc1"
edition = "2021"
rust-version = "1.75"
description = "IRIS: A compiled systems language for Autonomous Intelligent Systems"
license = "GPL-2.0-or-later"
repository = "https://github.com/moon9t/iris"
homepage = "https://github.com/moon9t/iris"

[[bin]]
name = "iris"
path = "src/main.rs"

[lib]
name = "iris"
path = "src/lib.rs"

[dependencies]
thiserror = "1.0"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
rustyline = "12.0"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[build-dependencies]
cc = "1.0"
