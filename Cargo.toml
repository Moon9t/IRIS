[package]
name = "iris"
version = "1.0.0-rc1"
edition = "2021"
rust-version = "1.75"
description = "IRIS: A compiled systems language for Autonomous Intelligent Systems"
license = "GPL-2.0-or-later"
repository = "https://github.com/moon9t/iris"
homepage = "https://github.com/moon9t/iris"

[[bin]]
name = "iris"
path = "src/main.rs"

[lib]
name = "iris"
path = "src/lib.rs"

[dependencies]
thiserror = "1.0"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
rustyline = "12.0"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
semver = "1.0"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"

[features]
default = []
# `native-llvm` (inkwell) removed in 1.0.0-rc1 — see src/codegen/mod.rs.
# Clang-free object emission is provided by src/codegen/llvm_c_api.rs instead.
text-backend = []
onnx = []
tensorflow = []
pytorch = []
blas = []
ml-backends = ["onnx", "tensorflow", "pytorch", "blas"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
# Full debug info costs significant compile + link time and disk I/O.
# Line tables are enough for backtraces and panic locations; set
# `debug = true` temporarily if stepping in a debugger.
debug = "line-tables-only"
# Dependencies are compiled once and rarely change — no debug info needed.
[profile.dev.package."*"]
debug = false
opt-level = 1

[build-dependencies]
cc = "1.0"
